    <!-- =========================================
         PERFORMANCE PAGE CSS
         ========================================= -->

    <style>
        /* =========================================
           PAGE RESET
           ========================================= */

        body.performance-page {
            margin: 0;
            padding: 0;
        }

        body.performance-page section {
            margin-top: 0;
        }

        body.performance-page img {
            height: auto;
        }


        /* =========================================
           INTERNAL HERO
           ========================================= */

        .performance-page .egos-internal-hero {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 360px;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .performance-page .egos-internal-hero-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
            width: 100%;
            height: 100%;
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
        }

        .performance-page .egos-internal-hero::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 1;
            background: rgba(0, 0, 0, 0.25);
            pointer-events: none;
        }

        .performance-page .egos-internal-hero-content {
            position: relative;
            z-index: 2;
            width: 100%;
            padding: 20px;
            text-align: center;
            box-sizing: border-box;
        }

        .performance-page .egos-internal-hero img.egos-page-title-image {
            display: block;
            width: 360px;
            max-width: 90vw;
            height: auto;
            margin: 0 auto;
        }


        /* =========================================
           TITLE IMAGE GLOW
           ========================================= */

        .performance-page .egos-page-title-image {
            display: block;
            max-width: 100%;
            height: auto;
            filter:
                drop-shadow(0 0 6px rgba(255, 255, 255, 0.85))
                drop-shadow(0 0 18px rgba(255, 255, 255, 0.6))
                drop-shadow(0 0 36px rgba(255, 255, 255, 0.35));
            animation: eGosTitleGlow 3s ease-in-out infinite;
        }

        @keyframes eGosTitleGlow {
            0%,
            100% {
                filter:
                    drop-shadow(0 0 5px rgba(255, 255, 255, 0.7))
                    drop-shadow(0 0 15px rgba(255, 255, 255, 0.45))
                    drop-shadow(0 0 28px rgba(255, 255, 255, 0.25));
            }

            50% {
                filter:
                    drop-shadow(0 0 9px rgba(255, 255, 255, 1))
                    drop-shadow(0 0 24px rgba(255, 255, 255, 0.8))
                    drop-shadow(0 0 45px rgba(255, 255, 255, 0.55));
            }
        }


        /* =========================================
           MEDIA SECTIONS
           ========================================= */

        .performance-page .egos-media-section {
            position: relative;
            width: 100%;
            margin: 0;
            padding: 60px 0;
            overflow: hidden;
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
        }

        .performance-page .egos-media-section::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 0;
            background: radial-gradient(
                ellipse at center,
                rgba(0, 0, 0, 0.05) 10%,
                rgba(0, 0, 0, 0.25) 50%,
                rgba(0, 0, 0, 0.75) 100%
            );
            pointer-events: none;
        }

        .performance-page .egos-media-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1050px;
            margin: 0 auto;
            padding: 0 20px;
            box-sizing: border-box;
        }


        /* =========================================
           FEATURED HEADING
           ========================================= */

        .performance-page .egos-section-heading {
            width: 100%;
            margin: 0 0 35px;
            padding: 0;
            text-align: center;
        }

        .performance-page .egos-archive-heading {
            width: 100%;
            margin: 0 0 30px;
            padding: 0;
            text-align: center;
        }

        .performance-page img.egos-page-title-image[alt="Featured"] {
            width: 200px;
            max-width: 90vw;
            height: auto;
            margin: 0 auto;
        }


        /* =========================================
           FEATURED VIDEO
           ========================================= */

        .performance-page .egos-featured-video {
            width: 100%;
            margin: 0 auto 70px;
        }

        .performance-page .egos-featured-title {
            margin: 0 0 18px;
            padding: 0;
            color: #ffffff !important;
            -webkit-text-fill-color: #ffffff !important;
            font-family: "Exo", sans-serif;
            font-size: 22px;
            font-weight: 500;
            line-height: 1.4;
            letter-spacing: 1.5px;
            text-align: center;
            text-transform: uppercase;
            opacity: 1;
        }

        .performance-page .egos-video-frame {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000000;
        }

        .performance-page .egos-video-frame iframe {
            position: absolute;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .performance-page .egos-video-caption {
            margin: 12px 0 0;
            padding: 0;
            text-align: center;
        }

        .performance-page .egos-video-caption p {
            margin: 0;
            padding: 0;
            color: rgba(255, 255, 255, 0.75);
            font-family: "Exo", sans-serif;
            font-size: 14px;
            line-height: 1.6;
        }


        /* =========================================
           ARCHIVAL HEADING
           ========================================= */

        .performance-page img.egos-page-title-image[alt="Archival"] {
            width: 200px;
            max-width: 90vw;
            height: auto;
            margin: 0 auto;
        }


        /* =========================================
           ARCHIVAL VIDEOS
           ========================================= */

        .performance-page .egos-archive {
            width: 100%;
            margin: 0;
            padding: 0;
        }

        .performance-page .egos-archive-item {
            width: 100%;
            margin: 0 0 48px;
            padding: 0;
        }

        .performance-page .egos-archive-item:last-child {
            margin-bottom: 0;
        }

        .performance-page .egos-archive-item .egos-featured-title {
            margin-bottom: 16px;
        }


        /* =========================================
           CONTACT SECTION
           ========================================= */

        .performance-page .contact-area {
            position: relative;
            margin: 0;
            background-position: center center;
            background-repeat: no-repeat;
            background-size: cover;
        }


        /* =========================================
           FOOTER
           ========================================= */

        .performance-page .footer-logo img {
            display: block;
            max-width: 100%;
            height: auto;
        }


        /* =========================================
           TABLET
           ========================================= */

        @media (max-width: 991px) {
            .performance-page .egos-media-section {
                padding: 50px 0;
            }

            .performance-page .egos-internal-hero img.egos-page-title-image {
                width: 320px;
            }

            .performance-page img.egos-page-title-image[alt="Featured"] {
                width: 160px;
            }

            .performance-page img.egos-page-title-image[alt="Archival"] {
                width: 160px;
            }
        }


        /* =========================================
           MOBILE
           ========================================= */

        @media (max-width: 767px) {
            .performance-page .egos-internal-hero {
                height: 280px;
            }

            .performance-page .egos-internal-hero-content {
                padding: 15px;
            }

            .performance-page .egos-internal-hero img.egos-page-title-image {
                width: 280px;
                max-width: 90vw;
            }

            .performance-page .egos-media-section {
                padding: 40px 0;
            }

            .performance-page .egos-media-container {
                padding-right: 15px;
                padding-left: 15px;
            }

            .performance-page .egos-section-heading {
                margin-bottom: 25px;
            }

            .performance-page .egos-archive-heading {
                margin-bottom: 25px;
            }

            .performance-page img.egos-page-title-image[alt="Featured"] {
                width: 160px;
            }

            .performance-page img.egos-page-title-image[alt="Archival"] {
                width: 160px;
            }

            .performance-page .egos-featured-video {
                margin-bottom: 50px;
            }

            .performance-page .egos-featured-title {
                margin-bottom: 14px;
                font-size: 17px;
                letter-spacing: 1px;
            }

            .performance-page .egos-archive-item {
                margin-bottom: 38px;
            }

            .performance-page .egos-video-caption p {
                font-size: 13px;
            }

            .performance-page .contact-area {
                background-position: center center;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .performance-page .egos-page-title-image {
                animation: none;
            }
        }
    </style>
</head>
