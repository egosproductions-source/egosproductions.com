   <style>

        .video-page {
            margin: 0;
            padding: 0;
        }

        .video-page section {
            margin: 0;
        }

.egos-internal-hero {
            position: relative;
            width: 100%;
            height: 320px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .egos-internal-hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            z-index: 0;
        }

        .egos-internal-hero::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.25);
            z-index: 1;
        }

        .egos-internal-hero-content {
            position: relative;
            z-index: 2;
            text-align: center;
        }

        .egos-internal-hero-content h2 {
            position: relative;
            margin: 0;
            color: #ffffff;
            font-size: 60px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .egos-internal-hero-content h2 span {
            position: absolute;
            left: 50%;
            top: 0;
            transform: translateX(-50%);
            width: 100%;
            color: transparent;
            -webkit-text-stroke: 1px rgba(255,255,255,0.25);
            z-index: -1;
        }

     .egos-page-title-image {
    display: block;
    width: 240px;
    height: auto;
    margin: 0 auto;
    max-width: 100%;

    filter:
        drop-shadow(0 0 4px rgba(255,255,255,0.65))
        drop-shadow(0 0 12px rgba(255,255,255,0.45))
        drop-shadow(0 0 24px rgba(255,255,255,0.25));

    animation: eGosLogoGlow 3s ease-in-out 0s infinite;
}

        @keyframes eGosTitleGlow {
    0%, 100% {
        filter:
            drop-shadow(0 0 6px rgba(255,255,255,0.9))
            drop-shadow(0 0 20px rgba(255,255,255,0.75))
            drop-shadow(0 0 40px rgba(255,255,255,0.5));
    }
    50% {
        filter:
            drop-shadow(0 0 10px rgba(255,255,255,1))
            drop-shadow(0 0 26px rgba(255,255,255,0.9))
            drop-shadow(0 0 55px rgba(255,255,255,0.65));
    }
}

        /* =========================================
           MEDIA SECTIONS
           ========================================= */

        .egos-media-section {
            width: 100%;

            padding: 55px 0;

            margin: 0;
        }


        .egos-media-container {

            margin: 0 auto;

            padding: 0 20px;

            box-sizing: border-box;
        }


        /* =========================================

        .egos-section-heading {

            margin-bottom: 35px;
        }

        .egos-section-heading h2 {
            color: #fff;
            font-family: 'Exo', sans-serif;
            font-size: 34px;
            font-weight: 500;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .egos-section-heading p {
            color: rgba(255,255,255,0.7);
            font-family: 'Exo', sans-serif;
            font-size: 15px;
            margin: 0;
        }
        }/* =========================================

.egos-media-section {
    width: 100%;
    padding: 55px 0;
    margin: 0;

    position: relative;
    overflow: hidden;
}


.egos-media-container {
    width: 100%;
    max-width: 1050px;
    margin: 0 auto;
    padding: 0 20px;
    box-sizing: border-box;
}


/* =========================================
   MEDIA BACKGROUND VIGNETTE
   ========================================= */

.egos-media-section::before {
    content: "";
    position: absolute;
    inset: 0;

    background: radial-gradient(
        ellipse at center,
        transparent 10%,
        rgba(0, 0, 0, 0.25) 50%,
        rgba(0, 0, 0, 0.75) 100%
    );

    z-index: 0;
    pointer-events: none;
}

.egos-media-section > * {
    position: relative;
    z-index: 1;
}
