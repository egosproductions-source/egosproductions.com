    <!-- =========================================
         AUDIO PAGE STYLES
         ========================================= -->
    <style>
        /* PAGE BASE */

        body.audio-page {
            margin: 0;
            padding: 0;
        }

        body.audio-page section {
            margin-top: 0;
        }

        /* INTERNAL HERO */

        .egos-internal-hero {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 320px;
            margin: 0;
            overflow: hidden;
        }

        .egos-internal-hero-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
            width: 100%;
            height: 100%;
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
        }

        .egos-internal-hero::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 1;
            background: rgba(0, 0, 0, 0.25);
        }

        .egos-internal-hero-content {
            position: relative;
            z-index: 2;
            text-align: center;
        }

        .egos-page-title-image {
            display: block;
            width: 240px;
            max-width: 100%;
            height: auto;
            margin: 0 auto;
            filter:
                drop-shadow(0 0 4px rgba(255, 255, 255, 0.65))
                drop-shadow(0 0 12px rgba(255, 255, 255, 0.45))
                drop-shadow(0 0 24px rgba(255, 255, 255, 0.25));
            animation: eGosTitleGlow 3s ease-in-out infinite;
        }

        @keyframes eGosTitleGlow {
            0%, 100% {
                filter:
                    drop-shadow(0 0 6px rgba(255, 255, 255, 0.75))
                    drop-shadow(0 0 16px rgba(255, 255, 255, 0.5))
                    drop-shadow(0 0 30px rgba(255, 255, 255, 0.25));
            }

            50% {
                filter:
                    drop-shadow(0 0 9px rgba(255, 255, 255, 0.95))
                    drop-shadow(0 0 22px rgba(255, 255, 255, 0.7))
                    drop-shadow(0 0 40px rgba(255, 255, 255, 0.4));
            }
        }

        /* MEDIA SECTION */

        .egos-media-section {
            position: relative;
            width: 100%;
            margin: 0;
            padding: 60px 0 70px;
            overflow: hidden;
            background-color: #080808;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .egos-media-section::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background: radial-gradient(
                ellipse at center,
                transparent 15%,
                rgba(0, 0, 0, 0.3) 55%,
                rgba(0, 0, 0, 0.85) 100%
            );
        }

        .egos-media-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 25px;
            box-sizing: border-box;
        }

        /* FEATURED / ARCHIVAL IMAGE HEADINGS */

        .egos-archive-heading {
            position: relative;
            z-index: 1;
            margin: 0 auto 40px;
            padding: 0 15px;
            text-align: center;
        }

        .egos-archive-heading img.egos-page-title-image {
            width: 200px;
            max-width: 100%;
            height: auto;
        }

        /* FEATURED RELEASES */

        .egos-featured {
            width: 100%;
            margin: 0 auto 70px;
        }

        .egos-featured-item {
            min-width: 0;
            width: 100%;
        }

        .egos-featured-wide {
            margin-bottom: 45px;
        }

        .egos-featured-row {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 40px;
        }

        .egos-featured-title {
            margin: 0 0 15px;
            padding: 0;
            color: #fff;
            text-align: center;
            font-family: "Exo", sans-serif;
            font-size: 20px;
            font-weight: 500;
            line-height: 1.4;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .egos-featured-embed {
            position: relative;
            width: 100%;
            overflow: hidden;
            background: #000;
            border-radius: 12px;
        }

        .egos-featured-embed iframe {
            display: block;
            width: 100%;
            height: 352px;
            border: 0;
            border-radius: 12px;
        }

        /* ARCHIVAL RELEASES */

        .egos-archive {
            width: 100%;
            margin: 0;
            padding: 0;
        }

        .egos-archive-item {
            width: 100%;
            margin: 0 0 48px;
            padding: 0;
        }

        .egos-archive-item:last-child {
            margin-bottom: 0;
        }

        .egos-video-frame {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            margin: 0;
            padding: 0;
            background: #000;
            border-radius: 12px;
        }

        .egos-video-frame iframe {
            position: absolute;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
            border-radius: 12px;
        }

        /* TABLET */

        @media (max-width: 991px) {
            .egos-media-container {
                padding-right: 20px;
                padding-left: 20px;
            }

            .egos-featured-row {
                gap: 25px;
            }

            .egos-archive-heading img.egos-page-title-image {
                width: 75px;
            }
        }

        /* MOBILE */

        @media (max-width: 767px) {
            .egos-internal-hero {
                height: 240px;
            }

            .egos-page-title-image {
                width: 200px;
            }

            .egos-media-section {
                padding: 40px 0 45px;
            }

            .egos-media-container {
                padding-right: 15px;
                padding-left: 15px;
            }

            .egos-archive-heading {
                margin-bottom: 30px;
            }

            .egos-archive-heading img.egos-page-title-image {
                width: 200px;
            }

            .egos-featured {
                margin-bottom: 50px;
            }

            .egos-featured-wide {
                margin-bottom: 35px;
            }

            .egos-featured-row {
                grid-template-columns: 1fr;
                gap: 35px;
            }

            .egos-featured-title {
                margin-bottom: 12px;
                font-size: 17px;
                letter-spacing: 1.5px;
            }

            .egos-featured-embed iframe {
                height: 352px;
            }

            .egos-archive-item {
                margin-bottom: 38px;
            }

            /* Mobile footer logo remains in the original left-column flow. */
            body.audio-page .footer-area .footer-logo {
                width: 170px;
                max-width: 100%;
            }

            body.audio-page .footer-area .footer-logo img {
                max-width: 170px;
            }
        }
    </style>
