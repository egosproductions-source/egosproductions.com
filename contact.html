         CONTACT PAGE CSS
         ========================================= -->

    <style>

        /* =========================================
           PAGE
           ========================================= */

        .contact-page {
            margin: 0;
            padding: 0;
        }


        /* =========================================
           INTERNAL HERO
           ========================================= */

        .egos-internal-hero {
            position: relative;

            width: 100%;
            height: 320px;

            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: 0;
            padding: 0;
        }


.egos-internal-hero-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%; /* or a fixed height like height: 50%; */
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    z-index: 0;
}


        .egos-internal-hero::after {
            content: "";

            position: absolute;

            inset: 0;

            background: rgba(0, 0, 0, 0.3);

            z-index: 1;
        }


      .egos-internal-hero-content {
    z-index: 2;              
    width: 100%;              
    text-align: center;         
    
    /* Push content down from the top */
    padding-top: 15vh; /* Adjust 'vh' (viewport height) or pixels (e.g., 150px) as needed */
}

        .egos-internal-hero-content h2 {
            position: relative;

            display: inline-block;

            margin: 0;

            color: #fff;

            font-size: 60px;
            line-height: 1;

            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: 2px;
        }


        .egos-internal-hero-content h2 span {
            position: absolute;

            left: 50%;
            top: 0;

            transform: translateX(-50%);

            width: 100%;

            color: transparent;

            -webkit-text-stroke: 1px rgba(255,255,255,0.25);

            z-index: -1;
        }



        /* =========================================
           CONTACT INFORMATION
           ========================================= */

        .egos-contact-links {
            margin-top: 35px;
        }


        .egos-contact-card {
            height: 100%;

            padding: 35px 20px;

            text-align: center;

            background: rgba(0,0,0,0.55);

            border: 1px solid rgba(255,255,255,0.15);

            box-sizing: border-box;
        }


        .egos-contact-icon {
            margin-bottom: 15px;

            font-size: 30px;

            color: #fff;
        }


        .egos-contact-card h5 {
            margin: 0 0 12px;

            color: #fff;

            font-size: 20px;

            font-weight: 600;
        }


        .egos-contact-card p {
            margin: 0;

            color: rgba(255,255,255,0.8);

            font-size: 14px;

            line-height: 1.6;
        }


        .egos-contact-card a {
            color: #fff;

            text-decoration: none;

            transition: opacity 0.3s ease;
        }


        .egos-contact-card a:hover {
            opacity: 0.65;

            text-decoration: none;
        }


        /* =========================================
           SOCIAL ICONS
           ========================================= */

        .egos-social-horizontal {
            display: flex;

            align-items: center;
            justify-content: center;

            gap: 18px;

            margin-top: 15px;
        }


        .egos-social-horizontal a {
            width: 42px;
            height: 42px;

            display: flex;

            align-items: center;
            justify-content: center;

            border: 1px solid rgba(255,255,255,0.5);

            border-radius: 50%;

            color: #fff;

            font-size: 18px;

            transition:
                background 0.3s ease,
                color 0.3s ease,
                transform 0.3s ease;
        }


        .egos-social-horizontal a:hover {
            background: #fff;

            color: #000;

            transform: translateY(-3px);
        }


        /* =========================================
           BOOKING SECTION
           ========================================= */

        .egos-booking-section {
            width: 100%;

            padding: 75px 0;

            margin: 0;

            background: #000;
        }


        .egos-booking-section .section-heading {
            margin-bottom: 35px;
        }


        .egos-booking-section .section-heading h2 {
            color: #fff;
        }


        .egos-booking-section .contact-form-area {
            max-width: 1000px;

            margin: 0 auto;
        }


        .egos-booking-section .form-group {
            margin-bottom: 20px;
        }


        .egos-booking-section .form-control {
            min-height: 50px;

            color: #fff;

            background: rgba(255,255,255,0.06);

            border: 1px solid rgba(255,255,255,0.2);

            border-radius: 0;
        }


        .egos-booking-section textarea.form-control {
            min-height: 180px;
        }


        .egos-booking-section .form-control::placeholder {
            color: rgba(255,255,255,0.55);
        }


        .egos-booking-section .form-control:focus {
            color: #fff;

            background: rgba(255,255,255,0.08);

            border-color: rgba(255,255,255,0.65);

            box-shadow: none;
        }


        /* =========================================
           BOOK BUTTON
           ========================================= */

        .egos-book-button {
            display: inline-block;

            margin-top: 10px;

            padding: 12px 30px;

            border: 1px solid rgba(255,255,255,0.8);

            color: #fff;

            background: transparent;

            text-decoration: none;

            text-transform: uppercase;

            letter-spacing: 1px;

            font-size: 13px;

            transition: all 0.3s ease;
        }


        .egos-book-button:hover {
            color: #000;

            background: #fff;

            text-decoration: none;
        }

        /* =========================================
   CONTACT FEATURED BACKGROUND
   ========================================= */

.egos-contact-featured {
    position: relative;
    width: 100%;
    padding: 75px 0;
    margin: 0;
    overflow: hidden;

    background-image: url('images/g10long.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

.egos-contact-featured::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.35);
    z-index: 0;
}

.egos-contact-featured > .container {
    position: relative;
    z-index: 1;
}


        /* =========================================
           MOBILE
           ========================================= */

        @media (max-width: 767px) {

            .egos-internal-hero {
                height: 240px;
            }


            .egos-internal-hero-content h2 {
                font-size: 42px;
            }

    
            .egos-contact-links {
                margin-top: 20px;
            }


            .egos-contact-card {
                margin-bottom: 15px;
            }


            .egos-booking-section {
                padding: 50px 0;
            }

        }

    </style>
