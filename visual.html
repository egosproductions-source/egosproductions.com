    <!-- =========================================
         VISUAL PAGE CSS
         ========================================= -->

    <style>

        .egos-internal-hero {
            position: relative;
            width: 100%;
            height: 320px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .egos-internal-hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            z-index: 0;
        }

        .egos-internal-hero::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.25);
            z-index: 1;
        }

        .egos-internal-hero-content {
            position: relative;
            z-index: 2;
            text-align: center;
        }

        .egos-internal-hero-content h2 {
            position: relative;
            margin: 0;
            color: #ffffff;
            font-size: 60px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .egos-internal-hero-content h2 span {
            position: absolute;
            left: 50%;
            top: 0;
            transform: translateX(-50%);
            width: 100%;
            color: transparent;
            -webkit-text-stroke: 1px rgba(255,255,255,0.25);
            z-index: -1;
        }

     .egos-page-title-image {
    display: block;
    width: 240px;
    height: auto;
    margin: 0 auto;
    max-width: 100%;

    filter:
        drop-shadow(0 0 4px rgba(255,255,255,0.65))
        drop-shadow(0 0 12px rgba(255,255,255,0.45))
        drop-shadow(0 0 24px rgba(255,255,255,0.25));

    animation: eGosLogoGlow 3s ease-in-out 0s infinite;
}

        @keyframes eGosTitleGlow {
    0%, 100% {
        filter:
            drop-shadow(0 0 6px rgba(255,255,255,0.9))
            drop-shadow(0 0 20px rgba(255,255,255,0.75))
            drop-shadow(0 0 40px rgba(255,255,255,0.5));
    }
    50% {
        filter:
            drop-shadow(0 0 10px rgba(255,255,255,1))
            drop-shadow(0 0 26px rgba(255,255,255,0.9))
            drop-shadow(0 0 55px rgba(255,255,255,0.65));
    }
}
        .egos-video-item iframe {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            border: 0;
            margin: 0;
        }

        @media (max-width: 767px) {

            .egos-internal-hero {
                height: 240px;
            }

            .egos-internal-hero-content h2 {
                font-size: 42px;
            }

            .egos-page-title-image {
                width: 180px;
            }

        }

        /* =========================================
           MEDIA SECTION
           ========================================= */

        .egos-media-section {
            position: relative;

            width: 100%;

            padding: 70px 0;

            margin: 0;

            overflow: hidden;
        }


        /* =========================================
           GALLERY BACKGROUND
           ========================================= */

        .egos-visual-gallery {
            background-image:
                linear-gradient(
                    rgba(0,0,0,0.45),
                    rgba(0,0,0,0.45)
                ),
                url('images/bgoption.jpg');

            background-size: cover;

            background-position: center;

            background-attachment: fixed;
        }


        .egos-visual-gallery::before {
            content: "";

            position: absolute;

            inset: 0;

            background: radial-gradient(
                ellipse at center,
                transparent 10%,
                rgba(0,0,0,0.15) 50%,
                rgba(0,0,0,0.65) 100%
            );

            pointer-events: none;

            z-index: 0;
        }


        /* =========================================
           CONTENT CONTAINER
           ========================================= */

        .egos-media-container {
            position: relative;

            z-index: 1;

            width: 100%;

            max-width: 1050px;

            margin: 0 auto;

            padding: 0 20px;

            box-sizing: border-box;
        }


        /* =========================================
           SECTION HEADING
           ========================================= */

        .egos-section-heading {
            text-align: center;
            margin-bottom: 35px;
        }

        .egos-section-heading h2 {
            color: #fff;
            font-family: 'Exo', sans-serif;
            font-size: 34px;
            font-weight: 500;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .egos-section-heading p {
            color: rgba(255,255,255,0.7);
            font-family: 'Exo', sans-serif;
            font-size: 15px;
            margin: 0;
        }

        /* =========================================
           FEATURE IMAGE
           ========================================= */

        .egos-visual-feature {
            width: 100%;

            margin: 0 0 25px;

            overflow: hidden;

            background: #000;
        }


        .egos-visual-feature img {
            display: block;

            width: 100%;

            height: 560px;

            object-fit: cover;

            transition: transform 0.5s ease;
        }


        .egos-visual-feature:hover img {
            transform: scale(1.02);
        }


       /* =========================================
   IMAGE GRID — 5 x 5
   ========================================= */

.egos-visual-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    width: 100%;
}

.egos-visual-grid-item {
    aspect-ratio: 1 / 1;
    overflow: hidden;
    background: #000;
}

.egos-visual-grid-item img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s ease;
}

.egos-visual-grid-item:hover img {
    transform: scale(1.05);
}

        /* =========================================
           MOBILE
           ========================================= */

        @media (max-width: 767px) {

            .egos-internal-hero {
                height: 240px;
            }


            .egos-internal-hero-content h2 {
                font-size: 42px;
            }


            .egos-media-section {
                padding: 55px 0;
            }


            .egos-visual-gallery {
                background-attachment: scroll;
            }


            .egos-visual-feature img {
                height: 350px;
            }


      .egos-visual-grid {
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
}


            

        }

    </style>
