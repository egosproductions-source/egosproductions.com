    <style>
        /* INTERNAL HERO */

        .egos-internal-hero {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 320px;
            margin: 0;
            overflow: hidden;
        }

        .egos-internal-hero-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
            width: 100%;
            height: 100%;
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
        }

        .egos-internal-hero::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 1;
            background: rgba(0, 0, 0, 0.25);
        }

        .egos-internal-hero-content {
            position: relative;
            z-index: 2;
            text-align: center;
        }

        .egos-page-title-image {
            display: block;
            width: 240px;
            max-width: 100%;
            height: auto;
            margin: 0 auto;
            filter:
                drop-shadow(0 0 4px rgba(255, 255, 255, 0.65))
                drop-shadow(0 0 12px rgba(255, 255, 255, 0.45))
                drop-shadow(0 0 24px rgba(255, 255, 255, 0.25));
            animation: eGosTitleGlow 3s ease-in-out infinite;
        }

        @keyframes eGosTitleGlow {
            0%, 100% {
                filter:
                    drop-shadow(0 0 6px rgba(255, 255, 255, 0.75))
                    drop-shadow(0 0 16px rgba(255, 255, 255, 0.5))
                    drop-shadow(0 0 30px rgba(255, 255, 255, 0.25));
            }

            50% {
                filter:
                    drop-shadow(0 0 9px rgba(255, 255, 255, 0.95))
                    drop-shadow(0 0 22px rgba(255, 255, 255, 0.7))
                    drop-shadow(0 0 40px rgba(255, 255, 255, 0.4));
            }
        }

        /* GALLERY SECTION */

        .egos-visual-gallery {
            position: relative;
            width: 100%;
            padding: 55px 0 70px;
            overflow: hidden;
            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.45),
                    rgba(0, 0, 0, 0.45)
                ),
                url("images/bgoption.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .egos-visual-gallery::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 0;
            background: radial-gradient(
                ellipse at center,
                transparent 10%,
                rgba(0, 0, 0, 0.15) 50%,
                rgba(0, 0, 0, 0.65) 100%
            );
            pointer-events: none;
        }

        .egos-media-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1250px;
            margin: 0 auto;
            padding: 0 25px;
            box-sizing: border-box;
        }

         /* FEATURED / ARCHIVAL IMAGE HEADINGS */

        .egos-archive-heading {
            position: relative;
            z-index: 1;
            margin: 0 auto 40px;
            padding: 0 15px;
            text-align: center;
        }

        .egos-archive-heading img.egos-page-title-image {
            width: 180px;
            max-width: 100%;
            height: auto;
        }


        /* ARTWORK GRID */

        .egos-visual-grid {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 12px;
            width: 100%;
            margin: 20px 0 40px;
        }

        .egos-visual-grid-item {
            position: relative;
            aspect-ratio: 1 / 1;
            min-width: 0;
            overflow: hidden;
            background: #000;
            cursor: pointer;
        }

        .egos-visual-grid-item img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .egos-visual-grid-item:hover img {
            transform: scale(1.05);
        }

        /* ARTWORK LIGHTBOX */

        .egos-lightbox {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 99999;
            align-items: center;
            justify-content: center;
            padding: 55px 20px 25px;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.94);
        }

        .egos-lightbox.is-open {
            display: flex;
        }

        .egos-lightbox-content {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            width: 100%;
            height: 100%;
            max-width: 1200px;
        }

        .egos-lightbox-image {
            display: block;
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: calc(100vh - 180px);
            object-fit: contain;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.08);
        }

        .egos-lightbox-caption {
            width: 100%;
            padding: 0 10px;
            box-sizing: border-box;
            text-align: center;
            color: #fff;
            font-family: "Exo", sans-serif;
        }

        .egos-lightbox-title {
            margin: 0 0 5px;
            color: #fff;
            font-size: 20px;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .egos-lightbox-medium {
            margin: 0;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            line-height: 1.5;
        }

        .egos-lightbox-close {
            position: absolute;
            top: -40px;
            right: 0;
            z-index: 2;
            padding: 5px 10px;
            border: none;
            background: transparent;
            color: #fff;
            font-size: 34px;
            line-height: 1;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .egos-lightbox-close:hover {
            opacity: 0.6;
        }

       
        /* TABLET */

        @media (max-width: 991px) {
            .egos-archive-heading .egos-page-title-image {
                width: 85px;
            }

            .egos-visual-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 10px;
            }

            .egos-media-container {
                padding-right: 20px;
                padding-left: 20px;
            }
        }

        /* MOBILE */

        @media (max-width: 767px) {
            .egos-internal-hero {
                height: 240px;
            }

            .egos-page-title-image {
                width: 180px;
            }

                background-attachment: scroll;
            }

            .egos-archive-heading {

            }

            .egos-archive-heading .egos-page-title-image {

            }

            .egos-media-container {
                padding-right: 12px;
                padding-left: 12px;
            }

            .egos-visual-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));

                margin-top: 15px;
                margin-bottom: 30px;
            }

            .egos-lightbox {

            }

            .egos-lightbox-image {

                max-height: calc(100vh - 190px);
            }

            .egos-lightbox-title {

            }

            .egos-lightbox-medium {

            }

            }

    <!-- ARTWORK LIGHTBOX FUNCTIONALITY -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const lightbox = document.getElementById("egos-lightbox");
            const lightboxImage = document.getElementById("egos-lightbox-image");
            const lightboxTitle = document.getElementById("egos-lightbox-title");
            const lightboxMedium = document.getElementById("egos-lightbox-medium");
            const closeButton = document.getElementById("egos-lightbox-close");
            const galleryImages = document.querySelectorAll(".egos-visual-grid-item img");

            if (!lightbox || !lightboxImage || !closeButton) {
                return;
            }

            function openLightbox(image) {
                lightboxImage.src = image.src;
                lightboxImage.alt = image.alt || "Artwork";

                lightboxTitle.textContent = image.dataset.title || "";
                lightboxMedium.textContent = image.dataset.medium || "";

                lightbox.classList.add("is-open");
                lightbox.setAttribute("aria-hidden", "false");
                document.body.style.overflow = "hidden";
                closeButton.focus();
            }

            function closeLightbox() {
                lightbox.classList.remove("is-open");
                lightbox.setAttribute("aria-hidden", "true");
                lightboxImage.src = "";
                document.body.style.overflow = "";
            }

            galleryImages.forEach(function (image) {
                image.addEventListener("click", function () {
                    openLightbox(image);
                });

                image.setAttribute("tabindex", "0");
                image.setAttribute("role", "button");
                image.setAttribute("aria-label", "Open artwork: " + image.alt);

                image.addEventListener("keydown", function (event) {
                    if (event.key === "Enter" || event.key === " ") {
                        event.preventDefault();
                        openLightbox(image);
                    }
                });
            });

            closeButton.addEventListener("click", closeLightbox);

            lightbox.addEventListener("click", function (event) {
                if (event.target === lightbox) {
                    closeLightbox();
                }
            });

            document.addEventListener("keydown", function (event) {
                if (event.key === "Escape" && lightbox.classList.contains("is-open")) {
                    closeLightbox();
                }
            });
        });
    </script>
